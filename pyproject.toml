[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datalens"
version = "0.1.0"
description = "Local data profiling, interactive visualization, and tabular classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "scikit-learn",
    "joblib",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
datalens = "datalens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
